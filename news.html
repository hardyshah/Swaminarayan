<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<script src="vachanamrut-concordance/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samachar News</title>
<meta name="description" content="News and updates of the Swaminarayan sampraday from the official Nar Narayan Dev (Kalupur) mandir: coming utsavs, events, photo albums and videos, refreshed every three hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Gujarati:wght@400;500;600;700&family=Rasa:wght@400;500;600&family=Shrikhand&display=swap">
<style>
:root{
  --paper:#f6f1e7; --surface:#ffffff; --sunk:#efe7d8; --ink:#231a12; --ink-2:#5e5246; --ink-3:#8d8073; --line:#e3d8c6;
  --saffron:#c2410c; --saffron-strong:#9a3412; --saffron-soft:#fde4cf; --peacock:#0e5a61; --peacock-soft:#d6ecea;
  --shadow:0 1px 2px rgba(40,25,10,.06),0 10px 28px rgba(40,25,10,.08);
  --f-read:"Rasa","Noto Serif Gujarati",Georgia,serif;
  --f-ui:"Anek Gujarati","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Shrikhand","Anek Gujarati",serif; --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14110e; --surface:#1d1915; --sunk:#26201a; --ink:#f1ebe2; --ink-2:#c3b7a8; --ink-3:#8f8476; --line:#3a3128;
  --saffron:#fb923c; --saffron-strong:#fdba74; --saffron-soft:#3b2414; --peacock:#5eead4; --peacock-soft:#123a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14110e; --surface:#1d1915; --sunk:#26201a; --ink:#f1ebe2; --ink-2:#c3b7a8; --ink-3:#8f8476; --line:#3a3128;
  --saffron:#fb923c; --saffron-strong:#fdba74; --saffron-soft:#3b2414; --peacock:#5eead4; --peacock-soft:#123a3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--peacock);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;color:var(--ink);white-space:nowrap;margin-right:auto}.brand:hover{text-decoration:none}
.brand .gu{font-family:var(--f-display);font-size:24px;color:var(--saffron);line-height:1}
.brand .en{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.nav{display:flex;gap:2px;flex-wrap:wrap}.nav a{color:var(--ink-2);padding:6px 10px;border-radius:999px;font-size:14px;font-weight:500}
.nav a:hover{text-decoration:none;background:var(--sunk);color:var(--ink)}.nav a.on{background:var(--ink);color:var(--paper)}
.theme{border:1px solid var(--line);background:none;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
main{padding-block:18px 110px}
.jay{text-align:center;font-family:var(--f-read);font-weight:600;color:var(--saffron-strong);font-size:clamp(17px,3.4vw,22px);margin:4px 0 14px}
small.e{display:block;font-size:.82em;color:var(--ink-2);font-weight:500;line-height:1.3}
.hero small.e,.big small.e,.tick small.e{color:inherit;opacity:.88}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 24px;color:#fff;box-shadow:var(--shadow);
  background:radial-gradient(110% 90% at 90% 0%,rgba(94,234,212,.35),transparent 55%),linear-gradient(135deg,#083c42,#0e5a61 50%,#155e75)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,54px);line-height:1.05;margin:0}
.hero h1 small{display:block;font-family:var(--f-ui);font-size:clamp(15px,2.6vw,19px);font-weight:600;opacity:.95;margin-top:6px}
.hero p{margin:10px 0 0;max-width:620px;opacity:.95;font-size:15px}
.upd{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px;font-size:13px}
.upd i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.tick{margin-top:16px;overflow:hidden;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;box-shadow:var(--shadow)}
.tick b{flex:none;background:var(--saffron);color:#fff;padding:10px 14px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tick .run{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tick .run span{display:inline-block;padding-left:100%;animation:run 60s linear infinite}.tick:hover .run span{animation-play-state:paused}
.tick .run a{color:var(--ink);font-weight:600;margin-right:38px}.tick .run a::before{content:"🪔 ";}
@keyframes run{to{transform:translateX(-100%)}}
h2.s{margin:32px 0 12px;font-family:var(--f-display);font-weight:400;color:var(--saffron);font-size:clamp(24px,4.6vw,32px);line-height:1.1}
h2.s small{display:block;font-family:var(--f-ui);font-size:14px;color:var(--ink-2);font-weight:600}
.ut{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.ut{grid-template-columns:minmax(0,1fr)}}
.big{position:relative;border-radius:22px;padding:22px;color:#fff;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(135deg,#9a3412,#c2410c 55%,#d97706)}
.big::after{content:"🪔";position:absolute;right:18px;bottom:6px;font-size:84px;opacity:.25}
.big .k{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;font-weight:600}
.big .nm{font-family:var(--f-read);font-size:clamp(24px,4.6vw,32px);font-weight:600;line-height:1.15;margin:6px 0}
.big .nm small{display:block;font-family:var(--f-ui);font-size:15px;opacity:.9;font-weight:500}
.cd{display:flex;gap:10px;margin-top:12px}
.cd div{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 12px;text-align:center;min-width:64px}
.cd b{display:block;font-size:28px;line-height:1}.cd span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 14px;box-shadow:var(--shadow)}
.li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}.li:last-child{border-bottom:0}
.dt{flex:none;width:54px;text-align:center;border-radius:12px;background:var(--saffron-soft);color:var(--saffron-strong);padding:4px 0;line-height:1.1}
.dt b{display:block;font-size:20px}.dt span{font-size:11px;font-weight:700;text-transform:uppercase}
.li.e .dt{background:var(--peacock-soft);color:var(--peacock)}
.li p{margin:0;font-weight:600;font-size:15px}.li p small{display:block;font-weight:500;color:var(--ink-2);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.nc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink);transition:transform .2s}
.nc:hover{transform:translateY(-3px);text-decoration:none}
.nc .im{aspect-ratio:16/10;background:var(--sunk);overflow:hidden;position:relative}
.nc .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.nc:hover .im img{transform:scale(1.04)}
.nc .tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.nc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.nc h3{margin:0;font-size:16.5px;line-height:1.3}.nc .m{font-size:13px;color:var(--ink-2)}
.nc p{margin:0;font-size:14px;color:var(--ink-2)}
.feat{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.feat .im{aspect-ratio:auto;min-height:240px}.feat h3{font-size:22px;font-family:var(--f-read)}
@media (max-width:700px){.feat{grid-template-columns:minmax(0,1fr)}.feat .im{min-height:0;aspect-ratio:16/10}}
.vid .im::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:40px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.live{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.live b{color:#dc2626}.live a.btn{margin-left:auto;background:#dc2626;color:#fff;border-radius:12px;padding:9px 16px;font-weight:700}
.empty{color:var(--ink-2);padding:12px 0}
.srcs{margin-top:30px;font-size:13.5px;color:var(--ink-2)}.srcs h3{color:var(--ink);font-size:16px;margin:0 0 6px}.srcs ul{margin:0;padding-left:18px}.srcs li{margin:3px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><span class="gu">શ્રી સ્વામિનારાયણ</span><span class="en">Home</span></a>
  <nav class="nav" aria-label="Pages">
    <a href="./">Today</a>
    <a href="play/">Play</a>
    <a class="on" href="news.html">News</a>
    <a href="panchang.html">Panchang</a>
    <a href="kaal-patrak/">Kaal Patrak</a>
    <a href="vachanamrut-concordance/">Vachanamrut</a>
    <a href="vachanamrut-concordance/live.html">Live</a>
  </nav>
  <button class="theme" id="theme" aria-label="Switch theme"></button>
</div></header>
<main class="wrap sp-lang-keep" id="app"></main>
<script>
(function(){
"use strict";
const app=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const getL=()=>{try{return localStorage.getItem("sp-lang")||"both"}catch(e){return "both"}};
const lang=()=>(window.SP_LANG&&SP_LANG.get())||document.documentElement.getAttribute("data-sp-lang")||getL();
function T(en,gu,inline){const m=lang();if(!gu)return esc(en);if(m==="gu")return esc(gu);if(m==="en")return esc(en);return inline?`${esc(gu)} · ${esc(en)}`:`${esc(gu)}<small class="e">${esc(en)}</small>`}
const GUD=n=>String(n).replace(/\d/g,d=>"૦૧૨૩૪૫૬૭૮૯"[d]);const N=n=>lang()==="gu"?GUD(n):String(n);
const now=new Date(),TODAY=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
const D=s=>new Date(s+"T00:00:00");const days=s=>Math.round((D(s)-D(TODAY))/864e5);
const fmt=(s,o)=>D(s).toLocaleDateString("en-GB",o||{weekday:"short",day:"numeric",month:"short",year:"numeric"});
let L=null,U=null;
function draw(){
  const up=(U?U.u:[]).filter(x=>x[0]>=TODAY);const nf=up.find(x=>x[3]==="f");
  const ev=(L&&L.events||[]).filter(e=>e.end>=TODAY),gal=(L&&L.galleries)||[],vid=(L&&L.videos)||[],live=(L&&L.streams)||[];
  const heads=[...ev.map(e=>({t:e.t,u:e.u})),...gal.map(g=>({t:g.t,u:g.u})),...vid.slice(0,4).map(v=>({t:v.t,u:"https://www.youtube.com/watch?v="+v.id}))];
  const updated=L&&L.updated?new Date(L.updated.replace("Z",":00Z")):null;
  let h=`<p class="jay">॥ શ્રી સ્વામિનારાયણો વિજયતેતરામ્ ॥</p>
  <section class="hero"><h1>${lang()==="en"?"News & updates":"સમાચાર"}<small>${T("News and updates of the sampraday","સંપ્રદાયના સમાચાર અને અપડેટ્સ",true)}</small></h1>
   <p>${T("Utsavs ahead, events at the mandirs, the newest photo albums and videos, straight from the official Shree Swaminarayan Mandir Kalupur (Nar Narayan Dev Gadi). Checked every three hours.","આવતા ઉત્સવો, મંદિરોના પ્રસંગો, નવાં ફોટો આલ્બમ અને વિડિયો, સીધા શ્રી સ્વામિનારાયણ મંદિર કાલુપુર (નરનારાયણ દેવ ગાદી)ની સત્તાવાર સાઇટ પરથી. દર ત્રણ કલાકે તપાસાય છે.")}</p>
   <span class="upd"><i></i>${updated?T("Last updated "+updated.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}),"છેલ્લે અપડેટ "+GUD(updated.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})),true):T("Loading…","લાવી રહ્યા છીએ…",true)}</span></section>`;
  if(heads.length)h+=`<div class="tick" aria-label="Headlines"><b>${T("Latest","તાજા",true)}</b><div class="run"><span>${heads.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`).join("")}</span></div></div>`;
  // utsavs
  h+=`<h2 class="s">${T("Utsavs ahead","આવતા ઉત્સવો")}</h2><div class="ut">`;
  if(nf){const d=days(nf[0]);h+=`<div class="big"><div class="k">${T("Next utsav","આગામી ઉત્સવ",true)}</div><div class="nm">${T(nf[1],nf[2])}</div><div>${esc(fmt(nf[0],{weekday:"long",day:"numeric",month:"long",year:"numeric"}))}</div>
    <div class="cd"><div><b>${d===0?"🎉":N(d)}</b><span>${d===0?T("today","આજે",true):T("days","દિવસ",true)}</span></div><div><b>${N(Math.floor(d/7))}</b><span>${T("weeks","અઠવાડિયાં",true)}</span></div></div></div>`}
  h+=`<div class="list">${up.slice(0,8).map(x=>{const dd=D(x[0]);return `<div class="li ${x[3]}"><div class="dt"><b>${N(dd.getDate())}</b><span>${dd.toLocaleDateString("en-GB",{month:"short"})}</span></div><p>${T(x[1],x[2])}<small>${esc(fmt(x[0],{weekday:"long"}))} · ${days(x[0])===0?T("today","આજે",true):T("in "+days(x[0])+" days",GUD(days(x[0]))+" દિવસમાં",true)}</small></p></div>`}).join("")||`<p class="empty">…</p>`}</div></div>
  <p style="font-size:12.5px;color:var(--ink-2);margin:8px 2px 0">${T("Dates computed for sunrise at Ahmedabad (Kalupur); the mandir's own calendar has the final word.","તારીખો અમદાવાદ (કાલુપુર)ના સૂર્યોદય પ્રમાણે ગણી છે; અંતિમ તારીખ મંદિરના પંચાંગ પ્રમાણે.",true)} <a href="https://www.swaminarayan.info/events/calendar" target="_blank" rel="noopener">${T("Kalupur mandir calendar","કાલુપુર મંદિર કેલેન્ડર",true)}</a></p>`;
  if(live.length)h+=`<div class="live"><span style="font-size:26px">📺</span><div><b>● LIVE</b> ${T("Darshan from Kalupur mandir is live now","કાલુપુર મંદિરથી લાઇવ દર્શન ચાલુ છે",true)}</div><a class="btn" href="vachanamrut-concordance/live.html">${T("Watch","દર્શન કરો",true)}</a></div>`;
  // events
  h+=`<h2 class="s">${T("Events at the mandirs","મંદિરોમાં પ્રસંગો")}</h2>`;
  h+=ev.length?`<div class="grid">${ev.map(e=>`<a class="nc" href="${esc(e.u)}" target="_blank" rel="noopener"><div class="im">${e.img?`<img src="${esc(e.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`:""}<span class="tag">${e.start<=TODAY?T("On now","ચાલુ",true):days(e.start)<=30?T("In "+days(e.start)+" days",GUD(days(e.start))+" દિવસમાં",true):esc(fmt(e.start,{month:"short",year:"numeric"}))}</span></div>
     <div class="bd"><h3>${esc(e.t)}</h3><div class="m">📅 ${esc(e.when)}${e.place?`<br>📍 ${esc(e.place)}`:""}</div>${e.desc?`<p>${esc(e.desc.length>160?e.desc.slice(0,158)+"…":e.desc)}</p>`:""}</div></a>`).join("")}</div>`:`<p class="empty">${T("No upcoming events listed right now.","અત્યારે કોઈ આગામી પ્રસંગ નથી.",true)}</p>`;
  // photo news
  h+=`<h2 class="s">${T("From the mandirs, in pictures","મંદિરોમાંથી, ચિત્રોમાં")}</h2>`;
  h+=gal.length?`<div class="grid">${gal.map((g,i)=>`<a class="nc ${i===0?"feat":""}" href="${esc(g.u)}" target="_blank" rel="noopener"><div class="im"><img src="${esc(g.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">${i===0?`<span class="tag">${T("Newest","નવું",true)}</span>`:""}</div>
     <div class="bd"><h3>${esc(g.t)}</h3><div class="m">${g.date?esc(fmt(g.date)):""}</div>${i===0?`<p>${T("Open the full photo album on the Kalupur mandir site.","કાલુપુર મંદિરની સાઇટ પર આખું ફોટો આલ્બમ જુઓ.",true)}</p>`:""}</div></a>`).join("")}</div>`:`<p class="empty">…</p>`;
  // videos
  h+=`<h2 class="s">${T("Latest videos","નવા વિડિયો")}</h2>`;
  h+=vid.length?`<div class="grid">${vid.slice(0,9).map(v=>`<a class="nc vid" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener"><div class="im"><img src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="" loading="lazy">${v.live?`<span class="tag" style="background:#dc2626">LIVE</span>`:""}</div><div class="bd"><h3>${esc(v.t)}</h3><div class="m">${v.date?esc(fmt(v.date)):""}</div></div></a>`).join("")}</div>`:`<p class="empty">…</p>`;
  h+=`<div class="srcs"><h3>${T("Sources","સ્રોત")}</h3><ul>
   <li><a href="https://www.swaminarayan.info" target="_blank" rel="noopener">Shree Swaminarayan Mandir Kalupur · swaminarayan.info</a>: ${T("events, picture gallery, calendar","પ્રસંગો, ફોટો ગેલેરી, કેલેન્ડર",true)}</li>
   <li><a href="https://www.youtube.com/@swaminarayantemplekalupur" target="_blank" rel="noopener">YouTube · Swaminarayan Temple Kalupur</a>: ${T("videos and live darshan","વિડિયો અને લાઇવ દર્શન",true)}</li>
   <li>${T("Utsav dates: computed from the panchang on this site","ઉત્સવની તારીખો: આ સાઇટના પંચાંગ પરથી",true)} (<a href="panchang.html">Panchang</a>)</li>
